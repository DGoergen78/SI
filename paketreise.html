<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Paketreise über zwei Router</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Netzplan oben, Aufgabe darunter; rechts Geräteinfo + Mitschnitt. MAC = Schicht 2 (Bernstein), IP = Schicht 3 (Blau). */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --sunk:#E3E8ED; --ink:#15202B; --muted:#56636F; --line:#C5CED8;
  --l2:#A85500; --l2-soft:#FBEAD6; --on-l2:#FFFFFF;
  --l3:#1C5BA8; --l3-soft:#DCE7F6; --on-l3:#FFFFFF;
  --ok:#1D7443; --ok-soft:#DDF1E5; --bad:#B0281F; --bad-soft:#F8E0DD;
  --btn:#1E2C3D; --on-btn:#FFFFFF; --zone:#F6F8FA;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#16202A; --sunk:#1D2935; --ink:#E3E9EF; --muted:#94A2B0; --line:#2C3A48;
  --l2:#F0A24E; --l2-soft:#3A2915; --on-l2:#1A1206;
  --l3:#74AAF0; --l3-soft:#162941; --on-l3:#08121F;
  --ok:#62C690; --ok-soft:#163324; --bad:#F2877F; --bad-soft:#3A1916;
  --btn:#D6E1EC; --on-btn:#0E141A; --zone:#121B23; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#16202A; --sunk:#1D2935; --ink:#E3E9EF; --muted:#94A2B0; --line:#2C3A48;
  --l2:#F0A24E; --l2-soft:#3A2915; --on-l2:#1A1206;
  --l3:#74AAF0; --l3-soft:#162941; --on-l3:#08121F;
  --ok:#62C690; --ok-soft:#163324; --bad:#F2877F; --bad-soft:#3A1916;
  --btn:#D6E1EC; --on-btn:#0E141A; --zone:#121B23; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-display);font-stretch:100%;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--l3);outline-offset:2px}

header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;margin-bottom:16px}
header .sub{color:var(--muted);margin-top:4px}
.prog{display:flex;flex-direction:column;gap:6px;min-width:min(100%,360px)}
.prog-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.bar{display:flex;gap:3px}
.bar span{flex:1;height:6px;border-radius:2px;background:var(--line)}
.bar span.done{background:var(--ink);opacity:.55}
.bar span.now{background:var(--ink)}
.ghost-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 10px;font-size:.85rem}
.ghost-btn:hover{border-color:var(--muted)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}

.topo-head{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);align-items:center}
.chip{display:inline-block;font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:1px 6px;border-radius:4px}
.chip.mac{background:var(--l2-soft);color:var(--l2)}
.chip.ip{background:var(--l3-soft);color:var(--l3)}
.topo-scroll{overflow-x:auto}
svg.topo{width:100%;min-width:640px;height:auto;display:block}
.zone{fill:var(--zone);stroke:var(--line);stroke-dasharray:6 5}
.zone-l{font-family:var(--f-display);font-weight:700;font-size:19px;fill:var(--muted);letter-spacing:.04em}
.zone-n{font-family:var(--f-mono);font-size:16px;fill:var(--muted)}
.link{stroke:var(--line);stroke-width:4;stroke-linecap:round;transition:stroke .2s}
.link.active{stroke:var(--ink)}
.link.stub{stroke-dasharray:3 7}
.port{font-family:var(--f-mono);font-size:14px;fill:var(--muted)}
.cloud path{fill:var(--zone);stroke:var(--line);stroke-width:2;stroke-dasharray:5 4}
.cloud text{font-family:var(--f-display);font-weight:700;font-size:16px;fill:var(--muted)}
.cloud .cn{font-family:var(--f-mono);font-weight:400;font-size:13px}
.dev{cursor:pointer}
.dev .hit{fill:transparent}
.dev .body{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.dev .scr{fill:var(--sunk)}
.dev .det{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dev text{font-family:var(--f-display);font-weight:700;font-size:21px;fill:var(--ink)}
.dev:hover .body{fill:var(--sunk)}
.dev.sel .body{stroke:var(--l3);stroke-width:4}
.dev.sel text{fill:var(--l3)}
.dev:focus{outline:none}
.dev:focus-visible .hit{stroke:var(--l3);stroke-width:2;stroke-dasharray:4 3}
.pkt rect{stroke:var(--surface);stroke-width:2}
.pkt text{font-family:var(--f-mono);font-weight:600;font-size:14px}
.pkt-icmp rect{fill:var(--l3)} .pkt-icmp text{fill:var(--on-l3)}
.pkt.ghost{opacity:.85} .pkt.ghost rect{stroke-dasharray:4 3;stroke:var(--ink)}

.task{display:flex;flex-direction:column;gap:14px}
.task .intro{max-width:70ch;display:flex;flex-direction:column;gap:8px}
.task .q{font-weight:700;font-size:1.08rem;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.opt:disabled{cursor:default}
.why{font-size:.92rem;color:var(--bad);margin:-2px 0 2px 14px}
.explain{background:var(--ok-soft);border-radius:8px;padding:12px 14px;max-width:75ch}
.explain b{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--btn);color:var(--on-btn);border:0;border-radius:7px;padding:9px 16px;font-weight:700}
.btn:disabled{opacity:.35;cursor:default}
.btn.sec{background:var(--sunk);color:var(--ink)}
.calc{font-family:var(--f-mono);font-size:.85rem;background:var(--surface);border-radius:6px;padding:8px 10px;margin:6px 0;overflow-x:auto;white-space:pre;line-height:1.6}

.frame{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.seg{flex:1 1 210px;border:1.5px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;background:var(--surface)}
.seg-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:6px}
.seg-h span{font-size:.78rem;color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:.8rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.fld select,.fld .val{font-family:var(--f-mono);font-size:.86rem;font-variant-numeric:tabular-nums;width:100%;padding:6px 8px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.fld.mac select,.fld.mac .val{border-color:var(--l2);background:var(--l2-soft)}
.fld.ip select,.fld.ip .val{border-color:var(--l3);background:var(--l3-soft)}
.fld .val.fix{border-style:dashed;background:transparent;color:var(--muted)}
.fld select.bad{border-color:var(--bad);border-width:2.5px;background:var(--bad-soft)}
.fld select.ok{border-color:var(--ok);border-width:2.5px}
.hints{border-left:3px solid var(--bad);padding:4px 0 4px 12px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.hints b{color:var(--bad)}
.narr{background:var(--sunk);border-radius:8px;padding:12px 14px;min-height:3.2em;display:flex;flex-direction:column;gap:4px}
.narr .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.steps-ctl{display:flex;flex-wrap:wrap;gap:8px}

.dev-empty{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.9rem;margin-top:8px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:.84rem;overflow-wrap:anywhere}
.kv dd.mac{color:var(--l2);font-weight:600}
.kv dd.ip{color:var(--l3);font-weight:600}
.sub-h{margin-top:14px;font-size:.78rem;font-family:var(--f-display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th{text-align:left;font-weight:700;color:var(--muted);font-size:.74rem;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 6px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.t{font-family:var(--f-body)}
.note{font-size:.84rem;color:var(--muted);margin-top:8px}
.devcard .close{display:none}

.log{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:340px;overflow-y:auto}
.log-e{border-bottom:1px solid var(--line);padding-bottom:6px;font-size:.84rem}
.log-e .l1{display:flex;gap:8px;align-items:baseline}
.log-e .nr{font-family:var(--f-mono);color:var(--muted);font-size:.78rem}
.proto{font-family:var(--f-mono);font-size:.72rem;font-weight:600;padding:0 5px;border-radius:3px;background:var(--l3-soft);color:var(--l3)}
.log-e .l2{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}

.sum td.m{color:var(--l2);font-weight:600}
.sum td.i{color:var(--l3);font-weight:600}
.keys{display:flex;flex-direction:column;gap:8px;max-width:75ch;padding-left:20px;margin:0}

@media (max-width:940px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .aside{position:static}
  .devcard{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:62vh;overflow-y:auto;border-radius:14px 14px 0 0;
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;box-shadow:0 -8px 30px rgb(0 0 0 / .25)}
  .devcard.open{transform:none}
  .devcard .close{display:inline-block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">IPv4 · Routing über mehrere Hops</p>
      <h1>Paketreise über zwei Router</h1>
      <p class="sub">PC1 pingt PC4. Was ändert sich an jedem Router, was bleibt gleich?</p>
    </div>
    <div class="prog">
      <div class="prog-top"><span class="eyebrow" id="phase"></span><button class="ghost-btn" id="restart" type="button">Neu starten</button></div>
      <div class="bar" id="bar"></div>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="card">
        <div class="topo-head">
          <h3>Netzplan</h3>
          <div class="legend"><span><span class="chip mac">MAC</span> Schicht 2</span><span><span class="chip ip">IP</span> Schicht 3</span><span>Geräte anklicken für Details</span></div>
        </div>
        <div class="topo-scroll">
        <svg class="topo" id="topo" viewBox="0 0 1200 450" role="img" aria-label="Netzplan: Netz A mit PC1, PC2 und Switch 1, Router 1, Transfernetz, Router 2, Netz B mit Switch 2, PC3 und PC4. Router 1 verbindet zusätzlich Netz C, Router 2 Netz D.">
          <rect class="zone" x="12" y="120" width="392" height="318" rx="14"/>
          <rect class="zone" x="796" y="120" width="392" height="318" rx="14"/>
          <text class="zone-l" x="30" y="150">NETZ A</text><text class="zone-n" x="30" y="172">192.168.10.0/24</text>
          <text class="zone-l" x="1170" y="150" text-anchor="end">NETZ B</text><text class="zone-n" x="1170" y="172" text-anchor="end">192.168.20.0/24</text>
          <text class="zone-n" x="600" y="318" text-anchor="middle">Transfernetz</text>
          <text class="zone-n" x="600" y="338" text-anchor="middle">10.0.0.0/30</text>
          <g id="links"></g>
          <g id="clouds"></g>
          <g id="ports"></g>
          <g id="devs"></g>
          <g id="pkts"></g>
        </svg>
        </div>
      </section>
      <section class="card task" id="task" aria-live="polite"></section>
    </div>

    <div class="col aside">
      <section class="card devcard" id="devcard">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <h3>Geräteinfo</h3><button class="ghost-btn close" id="devclose" type="button">Schließen</button>
        </div>
        <div id="devinfo"></div>
      </section>
      <section class="card">
        <h3>Mitschnitt</h3>
        <p class="note" style="margin-top:2px">Alle bisher gesendeten Frames, wie in Wireshark.</p>
        <div class="log" id="log"></div>
      </section>
    </div>
  </div>
</div>

<script>
(()=>{
const NS='http://www.w3.org/2000/svg';
const M={PC1:'00:1B:44:11:3A:B7',PC2:'00:1B:44:11:3A:C2',PC3:'00:1B:44:22:4D:05',PC4:'00:1B:44:22:4D:1E',
  R1a:'00:50:56:A1:10:01',R1t:'00:50:56:A1:00:01',R1c:'00:50:56:A1:30:01',
  R2t:'00:50:56:B2:00:02',R2b:'00:50:56:B2:20:01',R2d:'00:50:56:B2:40:01',BC:'FF:FF:FF:FF:FF:FF'};
const I={PC1:'192.168.10.11',PC2:'192.168.10.12',PC3:'192.168.20.13',PC4:'192.168.20.14',
  R1a:'192.168.10.1',R1t:'10.0.0.1',R1c:'192.168.30.1',R2t:'10.0.0.2',R2b:'192.168.20.1',R2d:'192.168.40.1'};
const NAME={PC1:'PC1',PC2:'PC2',PC3:'PC3',PC4:'PC4',R1a:'Router 1 (Gi0/0)',R1t:'Router 1 (Gi0/1)',R2t:'Router 2 (Gi0/0)',R2b:'Router 2 (Gi0/1)'};
const MAC_OPTS=[...new Set(Object.values(M))].sort();
const ipNum=s=>s.split('.').reduce((a,b)=>a*256+ +b,0);
const IP_OPTS=[...Object.values(I),'255.255.255.255'].sort((a,b)=>ipNum(a)-ipNum(b));

const NODES={PC1:[80,230],PC2:[80,380],SW1:[260,305],R1:[480,240],R1a:[452,240],R1t:[508,240],R1c:[480,212],
  R2:[720,240],R2t:[692,240],R2b:[748,240],R2d:[720,212],SW2:[940,305],PC3:[1120,230],PC4:[1120,380],CC:[480,62],CD:[720,62]};
const LINKS=[['PC1','SW1','P1'],['PC2','SW1','P2'],['R1a','SW1','P3'],['R1t','R2t'],['R2b','SW2','P1'],['PC3','SW2','P2'],['PC4','SW2','P3']];
const lkey=(a,b)=>[a,b].sort().join('-');

// Router-Daten (ARP hat bereits stattgefunden: alle Tabellen gefüllt)
const DEV={
  PC1:{kind:'pc',net:'Netz A',ip:I.PC1,mac:M.PC1,gw:I.R1a,netid:'192.168.10.0',port:'Switch 1 · Port 1',arp:[[I.R1a,M.R1a]]},
  PC2:{kind:'pc',net:'Netz A',ip:I.PC2,mac:M.PC2,gw:I.R1a,netid:'192.168.10.0',port:'Switch 1 · Port 2',arp:[[I.R1a,M.R1a]]},
  PC3:{kind:'pc',net:'Netz B',ip:I.PC3,mac:M.PC3,gw:I.R2b,netid:'192.168.20.0',port:'Switch 2 · Port 2',arp:[[I.R2b,M.R2b]]},
  PC4:{kind:'pc',net:'Netz B',ip:I.PC4,mac:M.PC4,gw:I.R2b,netid:'192.168.20.0',port:'Switch 2 · Port 3',arp:[[I.R2b,M.R2b]]},
  R1:{kind:'router',name:'Router 1',ifs:[['Gi0/0',I.R1a,'/24',M.R1a,'Netz A · Switch 1 Port 3'],['Gi0/1',I.R1t,'/30',M.R1t,'Transfernetz · Router 2'],['Gi0/2',I.R1c,'/24',M.R1c,'Netz C']],
    rt:[['192.168.10.0/24','C','direkt','Gi0/0'],['10.0.0.0/30','C','direkt','Gi0/1'],['192.168.30.0/24','C','direkt','Gi0/2'],['192.168.20.0/24','S','10.0.0.2','Gi0/1'],['192.168.40.0/24','S','10.0.0.2','Gi0/1']],
    arp:[[I.PC1,M.PC1,'Gi0/0'],[I.PC2,M.PC2,'Gi0/0'],[I.R2t,M.R2t,'Gi0/1']]},
  R2:{kind:'router',name:'Router 2',ifs:[['Gi0/0',I.R2t,'/30',M.R2t,'Transfernetz · Router 1'],['Gi0/1',I.R2b,'/24',M.R2b,'Netz B · Switch 2 Port 1'],['Gi0/2',I.R2d,'/24',M.R2d,'Netz D']],
    rt:[['10.0.0.0/30','C','direkt','Gi0/0'],['192.168.20.0/24','C','direkt','Gi0/1'],['192.168.40.0/24','C','direkt','Gi0/2'],['192.168.10.0/24','S','10.0.0.1','Gi0/0'],['192.168.30.0/24','S','10.0.0.1','Gi0/0']],
    arp:[[I.R1t,M.R1t,'Gi0/0'],[I.PC3,M.PC3,'Gi0/1'],[I.PC4,M.PC4,'Gi0/1']]},
  SW1:{kind:'switch',name:'Switch 1',net:'Netz A',ports:[['1','PC1'],['2','PC2'],['3','Router 1 Gi0/0']],mac:[[M.PC1,'1'],[M.PC2,'2'],[M.R1a,'3']]},
  SW2:{kind:'switch',name:'Switch 2',net:'Netz B',ports:[['1','Router 2 Gi0/1'],['2','PC3'],['3','PC4']],mac:[[M.R2b,'1'],[M.PC3,'2'],[M.PC4,'3']]}
};

const fld=(id,label,kind,answer,hint)=>({id,label,kind,answer,hint});
const fix=(label,value)=>({fixed:true,label,value});
function icmpSegs(o){return[
  {title:'Ethernet II',sub:'Schicht 2 · Frame-Header',items:[fld('eth_dst','Ziel-MAC','mac',o.eth_dst,o.h.eth_dst),fld('eth_src','Quell-MAC','mac',o.eth_src,o.h.eth_src),fix('EtherType','0x0800 (IPv4)')]},
  {title:'IPv4',sub:'Schicht 3 · Paket-Header',items:[fld('ip_src','Quell-IP','ip',o.ip_src,o.h.ip_src),fld('ip_dst','Ziel-IP','ip',o.ip_dst,o.h.ip_dst),fix('TTL',o.ttl),fix('Protokoll','1 (ICMP)')]},
  {title:'ICMP',sub:'Nutzdaten',items:[fix('Typ',o.type===8?'8 · Echo Request':'0 · Echo Reply')]}]}
const keepIP={src:'Router ändern die IP-Adressen nicht. Der ursprüngliche Absender bleibt im Paket stehen.',dst:'Die Ziel-IP ist das endgültige Ziel. Sie bleibt auf dem ganzen Weg gleich.'};

const STAGES=[
{type:'intro',phase:'Vorbereitung',title:'Das Netz kennenlernen',
 html:`<p>Netz A und Netz B sind diesmal über <b>zwei Router</b> verbunden. Zwischen den Routern liegt ein kleines Transfernetz (10.0.0.0/30). Jeder Router verbindet außerdem ein weiteres Netz (C und D). Diese Netze sind am Ping nicht beteiligt.</p>
 <p><b>ARP hat bereits stattgefunden.</b> Alle ARP-Caches und MAC-Adresstabellen sind schon gefüllt. Klicke die Geräte an, um Adressen, Routing-Tabellen und ARP-Caches zu sehen.</p>

const T0=.28,T1=.72;
function posOn(h,t){const [x1,y1]=NODES[h[0]],[x2,y2]=NODES[h[1]];return[x1+(x2-x1)*t,y1+(y2-y1)*t]}
function drawPkt(x,y,label,ghost){
  const g=el('g',{class:'pkt pkt-icmp'+(ghost?' ghost':''),transform:`translate(${x},${y})`},$('pkts'));
  const w=label.length*9+18;
  g.innerHTML=`<rect x="${-w/2}" y="-14" width="${w}" height="28" rx="5"/><text y="5" text-anchor="middle">${label}</text>`;
  return g;
}
function setLinks(hops){document.querySelectorAll('.link').forEach(l=>l.classList.remove('active'));(hops||[]).forEach(h=>{const l=document.querySelector(`.link[data-k="${lkey(h[0],h[1])}"]`);l&&l.classList.add('active')})}
let animTok=0;
function staticPkts(){
  animTok++;$('pkts').innerHTML='';setLinks([]);
  const s=STAGES[cur];if(s.type!=='packet')return;
  if(mode==='fill'){drawPkt(...posOn(s.steps[0].hops[0],T0),'ICMP ?',true);return}
  if(step===0){drawPkt(...posOn(s.steps[0].hops[0],T0),'ICMP');return}
  const hops=s.steps[step-1].hops;setLinks(hops);hops.forEach(h=>drawPkt(...posOn(h,T1),'ICMP'));
}
function animHops(hops){
  const tok=++animTok;$('pkts').innerHTML='';setLinks(hops);
  const items=hops.map(h=>({h,g:drawPkt(...posOn(h,T0),'ICMP')}));
  const dur=reduce?1:850,t0=performance.now();
  const fr=now=>{if(tok!==animTok)return;const p=Math.min(1,(now-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    items.forEach(it=>{const [x,y]=posOn(it.h,T0+(T1-T0)*e);it.g.setAttribute('transform',`translate(${x},${y})`)});
    if(p<1)requestAnimationFrame(fr)};
  requestAnimationFrame(fr);
}

const tbl=(head,rows)=>`<div class="tbl-wrap"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;

    T.innerHTML=h;
    T.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,o=s.options[i];mcPicks[i]=o.ok?'ok':'bad';if(o.ok)mcSolved=true;renderTask();(T.querySelector('#go')||T.querySelector('.opt.bad'))?.focus?.()});
    if(mcSolved)$('go').onclick=next;
    return;
  }
  if(s.type==='packet'){
    h+=`<div class="intro">${s.intro}</div>`;
    if(mode==='fill'){
      h+=segHTML(s,false);
      if(hints.length)h+=`<div class="hints">${hints.map(f=>`<p><b>${f.label}:</b> ${(answers[cur]||{})[f.id]?'':'Noch leer. '}${f.hint}</p>`).join('')}</div>`;
      h+=`<div class="actions"><button class="btn" id="check" type="button">Frame prüfen</button>${attempts>=2?'<button class="btn sec" id="reveal" type="button">Lösung einsetzen</button>':''}<span class="note" style="margin:0">Tipp: Klicke die Geräte an, um ihre Adressen nachzusehen.</span></div>`;
      T.innerHTML=h;
      T.querySelectorAll('select').forEach(sel=>sel.onchange=()=>{(answers[cur]=answers[cur]||{})[sel.dataset.f]=sel.value;delete marks[sel.dataset.f];sel.className=''});
      $('check').onclick=check;if($('reveal'))$('reveal').onclick=reveal;
      return;
    }
    const n=s.steps.length;
    h+=`<p class="note" style="margin:0">${revealed?'Lösung eingesetzt.':'Alle Felder richtig.'} So sieht der Frame aus, der jetzt unterwegs ist:</p>`+segHTML(s,true);
    h+=`<div class="narr"><span class="n">Schritt ${step} / ${n}</span><p>${step===0?`Der Frame liegt bei ${NAME[s.src]} bereit. Klicke auf „Nächster Schritt“.`:s.steps[step-1].text}</p></div>
      <div class="steps-ctl"><button class="btn sec" id="prev" type="button" ${step===0?'disabled':''}>◀ Zurück</button>
      <button class="btn sec" id="nxt" type="button" ${step>=n?'disabled':''}>Nächster Schritt ▶</button>
      <button class="btn sec" id="all" type="button" ${step>=n?'disabled':''}>${playing?'Anhalten':'Abspielen'}</button>
      ${step>=n?'<button class="btn" id="go" type="button">Weiter zur nächsten Aufgabe</button>':''}</div>`;
    T.innerHTML=h;
    $('prev').onclick=()=>{stopPlay();step--;renderAll()};
    $('nxt').onclick=()=>{stopPlay();fwd()};
    $('all').onclick=()=>{if(playing){stopPlay();renderTask()}else play()};
    if($('go'))$('go').onclick=next;
    return;
  }
  h+=`<p class="intro">Alle sechs Frames des Pings im Vergleich. Die <span class="chip mac">MAC</span>-Spalten wechseln an jedem Router. Die <span class="chip ip">IP</span>-Spalten bleiben gleich und tauschen nur beim Reply die Richtung.</p>
  ${hopTable(STAGES.filter(x=>x.hop))}
  <ul class="keys">
   <li><b>MAC-Adressen</b> gelten nur für einen Abschnitt, also innerhalb eines Netzes. Jeder Router entfernt den Ethernet-Frame und baut einen neuen mit den MAC-Adressen des nächsten Abschnitts.</li>
   <li><b>IP-Adressen</b> bezeichnen den ursprünglichen Absender und das endgültige Ziel. Kein Router ändert sie.</li>
   <li>Der <b>nächste Router</b> wird nur über seine MAC-Adresse angesprochen. Seine IP-Adresse (Next Hop) nutzt der sendende Router nur, um im ARP-Cache die MAC nachzuschlagen.</li>
   <li>Die <b>TTL</b> sinkt an jedem Router um 1. Von 64 auf 62 heißt: zwei Router lagen auf dem Weg.</li>
  </ul>
  <div class="actions"><button class="btn" id="again" type="button">Noch einmal von vorn</button></div>`;
  T.innerHTML=h;$('again').onclick=restart;
}

function check(){
  const s=STAGES[cur],a=answers[cur]||{};hints=[];
  fieldsOf(s).forEach(f=>{marks[f.id]=a[f.id]===f.answer?'ok':'bad';if(marks[f.id]==='bad')hints.push(f)});
  attempts++;if(!hints.length){mode='anim';step=0}
  renderAll();if(hints.length)document.querySelector('#task select.bad')?.focus();
}
function reveal(){const s=STAGES[cur];answers[cur]={};fieldsOf(s).forEach(f=>answers[cur][f.id]=f.answer);revealed=true;hints=[];mode='anim';step=0;renderAll()}
function fwd(){const s=STAGES[cur];if(step>=s.steps.length)return;step++;renderTask();renderLog();animHops(s.steps[step-1].hops)}
function play(){playing=true;const tick=()=>{if(!playing)return;const s=STAGES[cur];if(step<s.steps.length){fwd();playing=setTimeout(tick,1700)}else{playing=null;renderTask()}};tick()}
function stopPlay(){if(playing){clearTimeout(playing);playing=null}}
function next(){stopPlay();cur=Math.min(cur+1,STAGES.length-1);mode='fill';step=0;mcPicks={};mcSolved=false;marks={};hints=[];attempts=0;revealed=false;renderAll();$('task').scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'})}
function restart(){stopPlay();cur=0;for(const k in answers)delete answers[k];mode='fill';step=0;mcPicks={};mcSolved=false;marks={};hints=[];attempts=0;revealed=false;selected=null;renderAll();window.scrollTo({top:0})}
function renderAll(){renderProgress();renderTask();renderDevice();renderLog();staticPkts()}

$('restart').onclick=restart;
$('devclose').onclick=()=>$('devcard').classList.remove('open');
buildTopo();renderAll();
})();
</script>
</body>
</html>
